databaseChangeLog:
  - changeSet:
      id: 2
      author: alejandra
      changes:
        - insert:
            tableName: EMPLEADO
            columns:
              - column:
                  name: nombre_completo
                  value: "Arp Empleado Prueba"
              - column:
                  name: cargo
                  value: "Desarrollador Backend"
              - column:
                  name: email_corporativo
                  value: "arp.prueba@ecommerce.com"
              - column:
                  name: sueldo_base
                  valueNumeric: 1500.00
              - column:
                  name: anios_experiencia
                  valueNumeric: 3
              - column:
                  name: activo
                  valueBoolean: true
              - column:
                  name: fecha_ingreso
                  valueDate: "2026-05-18"
              - column:
                  name: sucursal_id
                  valueNumeric: 1
      rollback:
        - delete:
            tableName: EMPLEADO
            where: email_corporativo = 'arp.prueba@ecommerce.com'