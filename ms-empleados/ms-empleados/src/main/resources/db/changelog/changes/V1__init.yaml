databaseChangeLog:
  - changeSet:
      id: 1-create-table-empleado
      author: ecommerce-team
      changes:
        - createTable:
            tableName: empleado
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre_completo
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: cargo
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: email_corporativo
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: sueldo_base
                  type: DOUBLE
                  constraints:
                    nullable: false
              - column:
                  name: anios_experiencia
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: activo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: fecha_ingreso
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: sucursal_id
                  type: INT
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-insert-empleados
      author: ecommerce-team
      changes:
        - insert:
            tableName: empleado
            columns:
              - column: {name: nombre_completo, value: "Carlos Andrés Pérez"}
              - column: {name: cargo, value: "Jefe de Bodega"}
              - column: {name: email_corporativo, value: "c.perez@ecommerce.cl"}
              - column: {name: sueldo_base, valueNumeric: 850000.00}
              - column: {name: anios_experiencia, valueNumeric: 5}
              - column: {name: activo, valueBoolean: true}
              - column: {name: fecha_ingreso, valueDate: "2019-03-15"}
              - column: {name: sucursal_id, valueNumeric: 1}
        - insert:
            tableName: empleado
            columns:
              - column: {name: nombre_completo, value: "María Fernanda López"}
              - column: {name: cargo, value: "Ejecutiva de Ventas"}
              - column: {name: email_corporativo, value: "m.lopez@ecommerce.cl"}
              - column: {name: sueldo_base, valueNumeric: 720000.00}
              - column: {name: anios_experiencia, valueNumeric: 3}
              - column: {name: activo, valueBoolean: true}
              - column: {name: fecha_ingreso, valueDate: "2021-07-01"}
              - column: {name: sucursal_id, valueNumeric: 1}
        - insert:
            tableName: empleado
            columns:
              - column: {name: nombre_completo, value: "Jorge Ignacio Soto"}
              - column: {name: cargo, value: "Analista de Logística"}
              - column: {name: email_corporativo, value: "j.soto@ecommerce.cl"}
              - column: {name: sueldo_base, valueNumeric: 980000.00}
              - column: {name: anios_experiencia, valueNumeric: 7}
              - column: {name: activo, valueBoolean: false}
              - column: {name: fecha_ingreso, valueDate: "2017-01-10"}
              - column: {name: sucursal_id, valueNumeric: 2}
