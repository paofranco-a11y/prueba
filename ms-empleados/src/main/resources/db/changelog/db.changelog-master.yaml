databaseChangeLog:
  - changeSet:
      id: 1-crear-tabla-empleados
      author: ecommerce
      changes:
        - createTable:
            tableName: empleados
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: nombre_completo
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: correo_electronico
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: sueldo_base
                  type: float
                  constraints:
                    nullable: false
              - column:
                  name: sucursal_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: esta_activo
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: fecha_ingreso
                  type: date
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-insertar-datos-iniciales-empleados
      author: ecommerce
      changes:
        - insert:
            tableName: empleados
            columns:
              - column: { name: id, value: 1 }
              - column: { name: nombre_completo, value: "Juan Perez" }
              - column: { name: correo_electronico, value: "juan.perez@ecommerce.com" }
              - column: { name: sueldo_base, value: 850000.0 }
              - column: { name: sucursal_id, value: 10 }
              - column: { name: esta_activo, value: 1 }
              - column: { name: fecha_ingreso, value: "2024-03-15" }
        - insert:
            tableName: empleados
            columns:
              - column: { name: id, value: 2 }
              - column: { name: nombre_completo, value: "Maria Gomez" }
              - column: { name: correo_electronico, value: "maria.gomez@ecommerce.com" }
              - column: { name: sueldo_base, value: 920000.0 }
              - column: { name: sucursal_id, value: 12 }
              - column: { name: esta_activo, value: 1 }
              - column: { name: fecha_ingreso, value: "2025-01-10" }
        - insert:
            tableName: empleados
            columns:
              - column: { name: id, value: 3 }
              - column: { name: nombre_completo, value: "Carlos Plaza" }
              - column: { name: correo_electronico, value: "carlos.plaza@ecommerce.com" }
              - column: { name: sueldo_base, value: 780000.0 }
              - column: { name: sucursal_id, value: 10 }
              - column: { name: esta_activo, value: 0 }
              - column: { name: fecha_ingreso, value: "2024-06-20" }