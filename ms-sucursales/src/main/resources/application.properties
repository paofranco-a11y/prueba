spring.application.name=ms-sucursales
# 1. Puerto del Microservicio (el que pide el profesor)
server.port=8088

# 2. Configuración de Base de Datos (MySQL Workbench)
# Reemplaza 'db_sucursales' por el nombre exacto de tu esquema/base de datos en Workbench
spring.datasource.url=jdbc:mysql://localhost:3306/prueba1?serverTimezone=UTC
spring.datasource.username=root
# Pon aquí la contraseña que configuraste al instalar MySQL Workbench
spring.datasource.password=

# 3. Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

