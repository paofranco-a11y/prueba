databaseChangeLog:
  - changeSet:
      id: 1-crear-tablas-envios
      author: ecommerce
      changes:
        - createTable:
            tableName: envios
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: pedido_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: direccion_destino
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: costo_envio
                  type: float
                  constraints:
                    nullable: false
              - column:
                  name: es_internacional
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: fecha_despacho
                  type: date
                  constraints:
                    nullable: false
        - createTable:
            tableName: seguimientos
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: envio_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: fk_seguimiento_envio
                    referencedTableName: envios
                    referencedColumnNames: id
              - column:
                  name: estado_actual
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: ubicacion_actual
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: porcentaje_progreso
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: requiere_firma
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: fecha_actualizacion
                  type: date
                  constraints:
                    nullable: false

