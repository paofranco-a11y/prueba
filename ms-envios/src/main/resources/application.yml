# Configuracion de parametros comunes

spring:
  application:
    name: MS-ENVIOS
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/prueba5?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect


server:
  port: 8086

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

---

# Perfil desarrollo (DEV)

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/prueba5_dev?createDatabaseIfNotExist=true
    username: root
    password: ""
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    clear-checksums: true

logging:
  level:
    com.ecommerce.ms_envios: INFO

---
# Perfil de pruebas unitarias (TEST)

spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:mysql://localhost:3306/prueba5_test?createDatabaseIfNotExist=true
    username: root
    password: ""
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    clear-checksums: true