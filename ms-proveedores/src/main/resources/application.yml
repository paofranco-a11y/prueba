# Configuracion de parametros comunes
spring:
    application:
        name: MS-PROVEEDOR
    profiles:
        active: dev
    datasource:
        url: jdbc:mysql://localhost:3306/prueba1?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
        username: root
        password:
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.MySQLDialect

server:
    port: 8087

springdoc:
    api-docs:
        enabled: true
        path: /v3/api-docs
    swagger-ui:
        enabled: true
        path: /swagger-ui.html

eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/

---

# Perfil de desarollo
spring:
    config:
        activate:
            on-profile: dev
    datasource:
        url: jdbc:mysql://localhost:3306/prueba1_dev?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
        username: root
        password:
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.MySQLDialect

logging:
    level:
        com.prueba.ms_proveedores: DEBUG

---
# Perfil de pruebas unitarias (test)
spring:
    config:
        activate:
            on-profile: test
    datasource:
        url: jdbc:mysql://localhost:3306/prueba1_test?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
        username: root
        password:
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        database-platform: org.hibernate.dialect.MySQLDialect

logging:
    level:
        com.prueba.ms_proveedores: INFO