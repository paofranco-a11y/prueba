spring:
    application:
        name: ms-proveedores
    datasource:
        url: jdbc:mysql://localhost:3306/prueba1?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
        username: root
        password:
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.MySQLDialect

server:
    port: 8087

springdoc:
    api-docs:
        enabled: true
        path: /v3/api-docs
    swagger-ui:
        enabled: true
        path: /swagger-ui.html

logging:
    level:
        com.prueba.ms_proveedores: INFO

eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/