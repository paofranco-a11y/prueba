spring:
  application:
    name: MS-USUARIO
  datasource:
    url: jdbc:mysql://localhost:3306/prueba1?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: '1234'
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com:
      prueba:
        ms_usuario: INFO



